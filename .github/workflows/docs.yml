name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
      - delphi-data-package-dev
    paths:
      - "src/delphi-data/**"
      - "src/metadata_generator/**"
      - "src/launcher/**"
      - "src/experiment_conductor/**"
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages and docs dependencies
        run: |
          pip install --upgrade pip
          pip install -e "src/delphi-data[docs]" -e "src/metadata_generator[docs]" -e "src/launcher[docs]"
          # experiment_conductor depends on aind-chronic-ephys-uploader which is not on PyPI.
          # Install without deps (mkdocstrings only needs the package importable), then
          # add the PyPI-available runtime deps that are imported at module level.
          pip install --no-deps -e "src/experiment_conductor"
          pip install psutil python-dotenv

      - name: Deploy docs
        run: mkdocs gh-deploy --force --clean
