name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
      - delphi-data-package-dev
    paths:
      - "src/delphi-data/**"
      - "src/metadata_generator/**"
      - "src/launcher/**"
      - "src/experiment_conductor/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages and docs dependencies
        run: |
          pip install --upgrade pip
          # Install delphi-data with full deps (pulls in swc-aeon>=0.2.0 → pydantic>=2.12.4).
          pip install -e "src/delphi-data[docs]"
          # metadata_generator and launcher are installed without their transitive deps to
          # avoid the pydantic version conflict:
          #   swc-aeon 0.2.0  requires pydantic>=2.12.4
          #   aind-data-schema <=2.9.0 requires pydantic<2.12   (incompatible)
          # mkdocstrings/griffe only needs the packages importable for static analysis;
          # it does not need every runtime dep to be installed.
          pip install --no-deps -e "src/metadata_generator"
          pip install --no-deps -e "src/launcher"
          # experiment_conductor depends on aind-chronic-ephys-uploader (not on PyPI);
          # same --no-deps approach applies.
          pip install --no-deps -e "src/experiment_conductor"
          # Minimal runtime deps imported at module level across the no-deps installs.
          pip install numpy python-dotenv boto3

      - name: Deploy docs
        run: mkdocs gh-deploy --force --clean
