[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "experiment-conductor"
version = "0.1.0"
description = "Orchestrator for Delphi experiment launch, processing, metadata generation, and S3 upload"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon Pratt", email = "brandon.pratt@alleninstitute.org" }]

keywords = ["Delphi", "orchestration", "neuroscience", "AIND"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  # Sibling packages (installed editable)
  "delphi-data",
  "metadata-generator",
  "launcher",
  "aind-chronic-ephys-uploader",
  # Config
  "python-dotenv>=1.0",
  # Hotkeys
  "pynput>=1.7",
  # AWS
  "boto3>=1.34",
  # AIND schema (acquisition end-time update) — pin to version tested with metadata-generator
  "aind-data-schema>=2.6.0",
  # Process monitoring
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
experiment-conductor = "experiment_conductor.conductor:main"

[tool.hatch.build.targets.wheel]
packages = ["experiment_conductor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
