[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "experiment-conductor"
version = "0.2.0"
description = "Network-drive watcher that orchestrates multi-session metadata generation, delphi-data processing, and S3 upload"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brandon Pratt", email = "brandon.pratt@alleninstitute.org" }]

keywords = ["Delphi", "orchestration", "neuroscience", "AIND", "ephys"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  # Sibling packages (installed editable)
  "delphi-data",
  "metadata-generator",
  "aind-chronic-ephys-uploader",
  # Numerics (noise floor estimation)
  "numpy>=1.26",
  # Config
  "python-dotenv>=1.0",
  # AWS (confirmed-before-delete S3 queries)
  "boto3>=1.34",
  # AIND schema (acquisition end-time update)
  "aind-data-schema>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
conductor = "experiment_conductor.cli:main"
conductor-status = "experiment_conductor.upload_status_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["experiment_conductor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# uv: local-path overrides for packages not published to PyPI
# ---------------------------------------------------------------------------
[tool.uv.sources]
delphi-data = { path = "../delphi-data", editable = true }
metadata-generator = { path = "../metadata_generator", editable = true }
aind-chronic-ephys-uploader = { path = "../../../aind-chronic-ephys-uploader", editable = true }
