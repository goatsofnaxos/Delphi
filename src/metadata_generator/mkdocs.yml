site_name: metadata-generator
site_description: >
  Tools for generating AIND v2 metadata (subject, procedures, instrument, acquisition)
  for the Delphi and Pirouette experiments.
site_author: Delphi Analysis Team
site_url: https://goatsofnaxos.github.io/Delphi/metadata_generator/
repo_url: https://github.com/goatsofnaxos/Delphi
repo_name: goatsofnaxos/Delphi
docs_dir: docs
site_dir: site

use_directory_urls: true

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - API Reference:
    - Overview: api/index.md
    - cli: api/cli.md
    - config: api/config.md
    - subject: api/subject.md
    - instrument: api/instrument.md
    - acquisition: api/acquisition.md
    - procedures: api/procedures.md
    - utils: api/utils.md

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .          # package root (metadata_generator/ is importable from here)
          options:
            # Docstring parsing
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: false
            # Display
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Member ordering
            members_order: source
            group_by_category: true
            # Inherited members
            inherited_members: false
            # Filters
            filters:
              - "!^_[^_]"   # hide private (single underscore) members
              - "!^__"       # hide dunder members

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
