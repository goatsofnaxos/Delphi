# yaml-language-server: $schema=rule-schema.json

rule:
  rule_alias: Standard
  init_odor_index: 5
  sample_with_replacement: false
  state_definitions: [
    {name: DefaultState, odor_index: 5, transitions_to: [OdorA]},
    {name: OdorA, odor_index: 0, transitions_to: [OdorB, OdorB, OdorB, OdorB]},
    {name: OdorB, odor_index: 1, transitions_to: [OdorC, OdorC, OdorC, OdorC]},
    {name: OdorC, odor_index: 2, transitions_to: [OdorA, OdorA, OdorA, OdorA]}
  ]