# yaml-language-server: $schema=rule-schema.json

rule:
  rule_alias: Standard
  init_odor_index: 5
  sample_with_replacement: true
  state_definitions: [
    {name: DefaultState, odor_name: Default, transitions_to: [OdorA]},
    {name: OdorA, odor_name: OdorA, transitions_to: [OdorB]},
    {name: OdorB, odor_name: OdorB, transitions_to: [OdorC]},
    {name: OdorC, odor_name: OdorC, transitions_to: [DefaultState]}
  ]