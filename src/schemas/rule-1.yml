# yaml-language-server: $schema=rule-schema.json

rule:
  rule_alias: Standard
  init_odor_index: 5
  sample_with_replacement: true
  state_definitions: [
    {name: DefaultState, odor_index: 5, transitions_to: [OdorA]},
    {name: OdorA, odor_index: 0, transitions_to: [OdorB]},
    {name: OdorB, odor_index: 1, transitions_to: [OdorC]},
    {name: OdorC, odor_index: 2, transitions_to: [DefaultState]}
  ]