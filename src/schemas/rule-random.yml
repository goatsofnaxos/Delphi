# yaml-language-server: $schema=rule-schema.json

rule:
  rule_alias: Standard
  init_odor_index: 0x0001
  sample_with_replacement: true
  state_definitions: [
    {name: OdorA, odor_index: 0x0001, transitions_to: [DefaultState]},
    {name: OdorB, odor_index: 0x0002, transitions_to: [DefaultState]},
    {name: OdorC, odor_index: 0x0004, transitions_to: [DefaultState]},
    {name: OdorD, odor_index: 0x0008, transitions_to: [DefaultState]},
    {name: DefaultState, odor_index: 0x0010, transitions_to: 
    [OdorA, OdorB, OdorC, OdorD]},
  ]